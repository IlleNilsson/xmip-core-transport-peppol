[package]
name = "xmip-core-transport-peppol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-peppol"
description = "Peppol transport: the OpenPeppol AS4 profile over the as4 technology — one business document in its Standard Business Document Header is one Stream, its participants beside it as iso6523-actorid-upis::0088:… identifiers; a Receive Location unwraps what an access point posts, a Send Location wraps a document and resolves the far end from a static table or a given URL. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The as4 technology is the carrier the manifest
# declares: Peppol is the AS4 profile shaped for one network — the
# access-point party type, the transport infrastructure agreement, the
# process as the service, the document type as the action, the
# participants as message properties — and the User Message, the MIME
# body, the Receipt and the Signer are all read there. Standard library
# otherwise: the Standard Business Document Header is written and scanned
# here, as the estate does with flat XML. SMP and SML lookup of the far
# end are not written yet; a static table or a given URL names it. Its
# declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
as4 = { package = "xmip-core-transport-as4", git = "https://github.com/IlleNilsson/xmip-core-transport-as4", branch = "main", optional = true }
# The URL an access point is (`net::Endpoint`), read once for the estate.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[features]
# The technology: its code, everything it is built on, and its declaration.
# Without it the crate is its declaration alone (ADR-0064, amendments
# 2026-10-22 and 2026-11-26).
default = ["declaration", "dep:codec", "dep:as4", "dep:net"]
# The declaration alone: what a Location of this technology is configured
# with, `declaration::SETTINGS` and `SCHEMES`, with the billing invoice and
# process its defaults name, and none of the code — what the surfaces'
# library is to carry (open problem 48).
declaration = []
# HTTPS, through as4's, which is through http's: this technology maps its
# scheme to https and could not reach a TLS stack until 2026-09-23; the
# technology's code, so the default with it.
tls = ["default", "as4/tls"]
