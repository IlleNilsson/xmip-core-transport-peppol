# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-peppol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-peppol"
description = "Peppol transport: the OpenPeppol AS4 profile over the as4 technology — one business document in its Standard Business Document Header is one Stream, its participants beside it as iso6523-actorid-upis::0088:… identifiers; a Receive Location unwraps what an access point posts, a Send Location wraps a document and resolves the far end from a static table or a given URL. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The as4 technology is the carrier the manifest
# declares: Peppol is the AS4 profile shaped for one network — the
# access-point party type, the transport infrastructure agreement, the
# process as the service, the document type as the action, the
# participants as message properties — and the User Message, the MIME
# body, the Receipt and the Signer are all read there. Standard library
# otherwise: the Standard Business Document Header is written and scanned
# here, as the estate does with flat XML. SMP and SML lookup of the far
# end are not written yet; a static table or a given URL names it.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { package = "xmip-core-codec", git = "https://github.com/IlleNilsson/xmip-core-codec", branch = "main" }
as4 = { package = "xmip-core-transport-as4", git = "https://github.com/IlleNilsson/xmip-core-transport-as4", branch = "main" }

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
